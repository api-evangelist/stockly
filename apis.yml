name: Stockly
description: >-
  Stockly (Stockly SAS, headquartered in Vitry-sur-Seine, France) operates a
  global inventory network for e-commerce, positioning itself as "the first
  global inventory for Retail." It connects online retailers that are missing
  stock (Demanders) with brands and official retailers that hold surplus
  inventory (Suppliers), detecting out-of-stock variants and filling the gaps
  in real time so that e-shops never run out of stock. Stockly integrates
  directly with a retailer's e-commerce infrastructure via API, a CMS, or a
  marketplace, and is building toward a stock exchange for e-commerce inventory
  in compliance with brands' distribution policies. The company reports 300+
  partnered retailers across Europe and 100M+ available items, and is backed by
  Techstars. Stockly is primarily a partner-onboarded platform rather than a
  broad self-serve public developer API.
